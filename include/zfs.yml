# Single source of truth for the OpenZFS version axis.
#
# OpenZFS is an independently pinned third-party payload shipped as an opt-in
# systemd-sysext. Bump it only to a release whose META `Linux-Maximum` covers
# the FSDK kernel (freedesktop-sdk.bst:components/linux.bst); the tarball
# sha256 lives next to the source in elements/zfs/openzfs.bst.
#
#   %{zfs-version}   upstream release (tag zfs-<version>)   2.4.4
#
# Included by:
#   elements/zfs/openzfs.bst   -> release tarball URL
#   elements/oci/zfs-sysext.bst -> sysext asset name
variables:
  zfs-version: "2.4.4"
