# FSDK 26.08 ships no /etc/resolv.conf rule (upstream systemd leaves the
# symlink to the distro), and this DDI boots with an empty /etc, so nothing
# ever creates the symlink and kubelet fails every pod sandbox with
# "open /etc/resolv.conf: no such file or directory".
#
# Point /etc/resolv.conf at systemd-resolved's full resolver list (not the
# 127.0.0.53 stub), matching standard server distro behaviour.
L /etc/resolv.conf - - - - ../run/systemd/resolve/resolv.conf
