# Flatcar's image build populates /etc/resolv.conf in the image's /etc and
# strips /etc-populating lines from /usr/lib/tmpfiles.d (see
# flatcar/scripts build_library/build_image_util.sh). This DDI imports only
# Flatcar's /usr and boots with an empty /etc, so nothing ever creates the
# symlink and kubelet fails every pod sandbox with
# "open /etc/resolv.conf: no such file or directory".
#
# Recreate Flatcar's stock symlink: /etc/resolv.conf points at
# systemd-resolved's full resolver list (not the 127.0.0.53 stub), matching
# Flatcar >= 3510.3.0 behaviour.
L /etc/resolv.conf - - - - ../run/systemd/resolve/resolv.conf
