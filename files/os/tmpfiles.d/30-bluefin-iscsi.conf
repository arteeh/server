# open-iscsi state for iscsiadm/iscsid and democratic-csi's hostPath mounts.
# 00-bluefin-factory-etc.conf copies /etc/iscsi only when the directory is
# absent; this line also restores iscsid.conf when Ignition pre-created
# /etc/iscsi (e.g. with its own initiatorname.iscsi).
d /etc/iscsi 0755 root root -
C /etc/iscsi/iscsid.conf - - - - /usr/share/factory/etc/iscsi/iscsid.conf
d /var/lib/iscsi 0755 root root -
