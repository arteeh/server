# Root ships locked as "!unprovisioned" (bluefin-server-usr.bst), which
# systemd-firstboot reads as "root not configured yet". Upstream's
# --prompt-root-password would then block every headless boot, and the USB
# installer's console, on a password prompt. Drop only that prompt: the
# passwd.hashed-password.root / passwd.plaintext-password.root credentials
# still apply, and without one root stays locked.
[Service]
ExecStart=
ExecStart=systemd-firstboot --prompt-locale --prompt-keymap-auto --prompt-timezone --mute-console=yes
