# systemd-ssh-generator's per-connection sshd (behind the ssh.listen
# credential, AF_VSOCK and the local AF_UNIX socket) needs the same
# per-device host keys as sshd.service; without them it exits with
# "no hostkeys available". See ssh-host-keygen.service.
[Unit]
Wants=ssh-host-keygen.service
After=ssh-host-keygen.service
