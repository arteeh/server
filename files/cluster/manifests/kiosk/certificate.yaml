# TLS for the kiosk proxy, issued by the in-cluster CA.
#
# This is what replaced the openssl invocation in the old sysext element, which
# baked a 10-year self-signed key into every published image — the same private
# key on every appliance. cert-manager mints this one on the machine and renews
# it automatically.
#
# Short-lived on purpose: 90 days, renewed at 30 days remaining. A kiosk
# certificate that outlives the appliance's install is a certificate nobody
# notices has leaked.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubestellar-kiosk-tls
  namespace: kubestellar-console
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  secretName: kubestellar-kiosk-tls
  commonName: KubeStellar Console
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - localhost
    - kubestellar-kiosk-proxy.kubestellar-console.svc.cluster.local
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: bluefin-ca
    kind: ClusterIssuer
    group: cert-manager.io
