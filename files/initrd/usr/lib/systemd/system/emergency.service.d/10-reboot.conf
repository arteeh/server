[Unit]
# An unattended server cannot use an emergency shell (root is locked).
# Print what failed and reboot, so systemd-boot's boot counting can fall
# back to the previous image after the new one exhausts its tries.
SuccessAction=reboot-force
FailureAction=reboot-force

[Service]
Type=oneshot
ExecStart=
ExecStart=-/usr/bin/bash -c 'echo "Boot failed; errors follow, rebooting in 10s." >/dev/console; journalctl -b -p err --no-pager -o short-monotonic >/dev/console 2>&1; sleep 10'
