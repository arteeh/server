[Unit]
# An unattended server cannot use an emergency shell (root is locked).
# Print what failed and reboot, so a diskless node retries and systemd-boot's
# boot counting can fall back to the previous image after the new one
# exhausts its tries.
SuccessAction=reboot-force
FailureAction=reboot-force

[Service]
# idle: start once the isolate's stop jobs are done, so their status lines
# do not interleave with the summary.
Type=idle
# How long the summary stays on screen before the reboot (seconds, default
# 60); the bluefin.failure_delay= kernel argument overrides it where the
# command line is not locked by Secure Boot.
ImportCredential=bluefin.failure_delay
ExecStart=
ExecStart=-/usr/libexec/bluefin-boot-diagnostics failure-summary
