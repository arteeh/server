[Unit]
# The diskless initrd downloads the whole OS image into /run (RAM). Check
# first that it fits, so a small machine fails with "needs ~X MiB RAM"
# instead of an out-of-space error deep in the download. Wants=, not
# Requires=: the check stops the boot through its own OnFailure=, which it
# triggers only when it knows the image cannot fit; a check that is missing
# or broken must not hold up the download.
Wants=bluefin-pull-check@%i.service
After=bluefin-pull-check@%i.service

# Without this a failed download only surfaces when the /usr devices time out
# (systemd.default_device_timeout_sec=300); go straight to the failure
# summary and reboot instead.
OnFailure=emergency.target
OnFailureJobMode=isolate
