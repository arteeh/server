# nouveau and nvidia cannot both drive a GPU: keep nouveau off it. This only
# covers loads after the sysext merged (udev binds nouveau to the GPUs before
# that); nvidia-load.service evicts an already bound nouveau first.
blacklist nouveau
options nouveau modeset=0
# The open kernel modules run the GPU through its GSP firmware.
options nvidia NVreg_EnableGpuFirmware=1
