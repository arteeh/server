# The kubestellar-console-github-oauth Secret is NOT committed here (#72): its
# jwt-secret signs console session tokens, and a value published in git would
# let anyone forge valid sessions on every default install. The Secret is
# generated at first boot with a random jwt-secret by
# /usr/share/k0s/kubeflex/generate-console-secret.sh (written as
# 02-kubestellar-console-secret.yaml, which sorts before the console
# Deployment in 40-kubestellar-console.yaml). Operators supply real GitHub
# OAuth credentials by editing that generated Secret; the console consumes
# client-id/client-secret with `optional: true`, so empty values are fine.
apiVersion: v1
kind: Namespace
metadata:
  name: kubestellar-console
