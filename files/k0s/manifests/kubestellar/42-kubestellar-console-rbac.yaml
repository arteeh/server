# First-boot fix (#193): the console pod reads the local embedded k0s cluster
# directly, so it needs read access to render live nodes, namespaces and pods
# instead of falling back to demo cards. This ServiceAccount plus the read-only
# ClusterRole below is the actual mechanism behind the fix. Bound to the
# console's own ServiceAccount so the default account stays unprivileged.
#
# Scope note: the resource list mirrors what the console dashboard renders --
# the namespace overview and ConfigMap cards read configmaps, and the resource
# cards read events, limitranges and resourcequotas. Verbs are read-only and
# the console is only reachable through the 127.0.0.1-bound kiosk proxy
# (41-kubestellar-kiosk-proxy.yaml), never from the network. Secrets are
# deliberately excluded. Resource names must be exact: Kubernetes silently
# ignores unknown names in RBAC rules, so a typo removes the grant without any
# error (see tests/unit/test_kubestellar_kiosk.py).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
  labels:
    app.kubernetes.io/name: kubestellar-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubestellar-console-reader
  labels:
    app.kubernetes.io/name: kubestellar-console
rules:
- apiGroups: [""]
  resources:
    - nodes
    - namespaces
    - pods
    - services
    - configmaps
    - events
    - persistentvolumes
    - persistentvolumeclaims
    - serviceaccounts
    - endpoints
    - limitranges
    - resourcequotas
    - replicationcontrollers
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
    - deployments
    - statefulsets
    - daemonsets
    - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
    - jobs
    - cronjobs
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubestellar-console-reader
  labels:
    app.kubernetes.io/name: kubestellar-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubestellar-console-reader
subjects:
- kind: ServiceAccount
  name: kubestellar-console
  namespace: kubestellar-console
