# Seeds the writable kubeadm init config. Applied only by
# kubeadm-init-config.service, by absolute path: this file is not in a
# tmpfiles.d directory, so a worker node never gets an init config.
d /etc/kubernetes/bluefin 0755 root root -
C /etc/kubernetes/bluefin/init.yaml - - - - /usr/share/bluefin/kubeadm/init.yaml
