# Writable host state for containerd, crictl and kubelet. Applied at boot and,
# because the sysext may merge after systemd-tmpfiles-setup.service, again by
# containerd.service's ExecStartPre.
d /etc/containerd 0755 root root -
C /etc/containerd/config.toml - - - - /usr/share/bluefin/containerd/config.toml
d /etc/containerd/certs.d 0755 root root -
C /etc/crictl.yaml - - - - /usr/share/bluefin/kubeadm/crictl.yaml
d /etc/cni/net.d 0755 root root -
d /opt/cni/bin 0755 root root -
d /etc/kubernetes/manifests 0755 root root -
d /var/lib/kubelet/volumeplugins 0755 root root -
