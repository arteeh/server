apiVersion: batch/v1
kind: Job
metadata:
  name: hubble-generate-certs-687da7eec1-ea7751ad
  namespace: kube-system
  labels:
    k8s-app: hubble-generate-certs
    app.kubernetes.io/name: hubble-generate-certs
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: cilium-1.20.2
spec:
  template:
    metadata:
      labels:
        k8s-app: hubble-generate-certs
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: certgen
        image: quay.io/cilium/certgen:v0.4.11@sha256:14d29a176fc96d15b154559ce1a5baf01367c10baabfa7bb8028b72f087a56f0
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
        command:
        - /usr/bin/cilium-certgen
        args:
        - --ca-generate=true
        - --ca-reuse-secret
        - --ca-secret-namespace=kube-system
        - --ca-secret-name=cilium-ca
        - --ca-common-name=Cilium CA
        - --ca-enforce-validity-throughout-leaves-duration=true
        env:
        - name: CILIUM_CERTGEN_CONFIG
          value: |
            certs:
            - name: hubble-server-certs
              namespace: kube-system
              commonName: "*.default.hubble-grpc.cilium.io"
              hosts:
              - "*.default.hubble-grpc.cilium.io"
              usage:
              - signing
              - key encipherment
              - server auth
              - client auth
              validity: 8760h
            - name: hubble-relay-client-certs
              namespace: kube-system
              commonName: "*.hubble-relay.cilium.io"
              hosts:
              - "*.hubble-relay.cilium.io"
              usage:
              - signing
              - key encipherment
              - client auth
              validity: 8760h
      hostNetwork: false
      serviceAccountName: hubble-generate-certs
      automountServiceAccountToken: true
      restartPolicy: OnFailure
