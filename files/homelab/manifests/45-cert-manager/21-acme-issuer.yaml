# Applied only when HOMELAB_ACME_EMAIL is set. HTTP-01 is solved through the
# default Gateway, so the names must resolve to it from the ACME server.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: acme
spec:
  acme:
    email: "${HOMELAB_ACME_EMAIL}"
    server: "${HOMELAB_ACME_SERVER}"
    privateKeySecretRef:
      name: acme-account-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - kind: Gateway
            name: homelab
            namespace: envoy-gateway-system
