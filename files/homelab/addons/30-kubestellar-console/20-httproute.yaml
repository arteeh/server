# The KubeStellar Console on the homelab Gateway at kubestellar.<HOMELAB_DOMAIN>
# (sign-in with GitHub OAuth only).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
spec:
  parentRefs:
  - name: homelab
    namespace: envoy-gateway-system
  hostnames:
  - "kubestellar.${HOMELAB_DOMAIN}"
  rules:
  - backendRefs:
    - name: kubestellar-console
      port: 8080
