        app.kubernetes.io/name: clusterrolebinding
        app.kubernetes.io/part-of: kubestellar
      name: '{{.ControlPlaneName}}-kubestellar-proxy-rolebinding'
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: '{{.ControlPlaneName}}-kubestellar-proxy-role'
    subjects:
    - kind: ServiceAccount
      name: default
      namespace: '{{.Namespace}}'
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        control-plane: controller-manager
      name: kubestellar-controller-manager-metrics-service
    spec:
      ports:
      - name: metrics
        port: 8443
        protocol: TCP
        targetPort: metrics
      selector:
        control-plane: controller-manager
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        control-plane: controller-manager
      name: kubestellar-controller-manager
    spec:
      replicas: 1
      selector:
        matchLabels:
          control-plane: controller-manager
      template:
        metadata:
          annotations:
            kubectl.kubernetes.io/default-container: manager
          labels:
            control-plane: controller-manager
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                    - amd64
                    - arm64
                    - ppc64le
                    - s390x
                  - key: kubernetes.io/os
                    operator: In
                    values:
                    - linux
          containers:
          - args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8080/
            - --logtostderr=true
            - --v=0
            image: quay.io/brancz/kube-rbac-proxy:v0.20.2@sha256:ad0fa9f0adc928b557663297bd22c610533960d77acdec289ce8a636f0ea2114
            name: kube-rbac-proxy
            ports:
            - containerPort: 8443
              name: metrics
              protocol: TCP
            resources:
              limits:
                cpu: 500m
                memory: 128Mi
              requests:
                cpu: 5m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
          - args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=127.0.0.1:8080
            - --pprof-bind-address=:8082
            - --leader-elect
            - --wds-name={{.ControlPlaneName}}
            - --its-name={{.ITSName}}
            - --api-groups={{.APIGroups}}
            - -v=2
            image: ghcr.io/kubestellar/kubestellar/controller-manager:0.30.0@sha256:3314ec087430094fd9fc8692ed31178d7fd310a66bc3cc3f81813aaef73f0dd9
            imagePullPolicy: IfNotPresent
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8081
              initialDelaySeconds: 15
              periodSeconds: 20
            name: manager
            ports:
            - containerPort: 8082
              name: debug-pprof
              protocol: TCP
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8081
              initialDelaySeconds: 5
              periodSeconds: 10
            resources:
              limits:
                cpu: 500m
                memory: 1Gi
              requests:
                cpu: 10m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
          securityContext:
            runAsNonRoot: true
          terminationGracePeriodSeconds: 10
---
apiVersion: tenancy.kflex.kubestellar.org/v1alpha1
kind: PostCreateHook
metadata:
  name: transport-controller
  labels:
    kflex.kubestellar.io/cptype: wds
spec:
  templates:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: '{{.ControlPlaneName}}-transport-controller'
    rules:
    - apiGroups:
      - ''
      resources:
      - secrets
      verbs:
      - get
    - apiGroups:
      - tenancy.kflex.kubestellar.org
      resources:
      - controlplanes
      verbs:
      - get
      - watch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: '{{.ControlPlaneName}}-transport-controller'
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: '{{.ControlPlaneName}}-transport-controller'
    subjects:
    - kind: ServiceAccount
      name: default
      namespace: '{{.Namespace}}'
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: transport-controller
    spec:
      replicas: 1
      selector:
        matchLabels:
          name: transport-controller
      template:
        metadata:
          labels:
            name: transport-controller
        spec:
          initContainers:
          - name: get-its-kubeconfig
            image: ghcr.io/kubestellar/kubestellar/kflex-get-kubeconfig:0.30.0@sha256:efedc620497f87bec7af57225a7bb2bdc9d4eba60b3f8848efbbaaffc1f2f145
            args:
            - --control-plane-label-selector
            - kflex.kubestellar.io/cptype=its
            - --control-plane-name
            - '{{.ITSName}}'
            - --output-file
            - /etc/kube/its/kubeconfig
            volumeMounts:
            - name: its-kubeconfig-volume
              mountPath: /etc/kube/its
          containers:
          - name: transport-controller
            image: ghcr.io/kubestellar/kubestellar/ocm-transport-controller:0.30.0@sha256:c422af62b09a335c55829e13a41559dad9522173c5f505ce93ea0ca86a5387a0
            args:
            - --metrics-bind-address=:8090
            - --pprof-bind-address=:8092
            - --transport-kubeconfig=/etc/kube/its/kubeconfig
            - --transport-qps=5
            - --transport-burst=10
            - --wds-kubeconfig=/etc/kube/wds/{{.WDSSecretKey}}
            - --wds-name={{.ControlPlaneName}}
            - --wds-qps=5
            - --wds-burst=10
            - -v=2
            - --max-num-wrapped=1
            - --max-size-wrapped=512000
            volumeMounts:
            - name: wds-kubeconfig-volume
              mountPath: /etc/kube/wds
              readOnly: true
            - name: its-kubeconfig-volume
              mountPath: /etc/kube/its
              readOnly: true
          volumes:
          - name: wds-kubeconfig-volume
            secret:
              secretName: '{{.WDSSecretName}}'
          - name: its-kubeconfig-volume
            emptyDir:
              medium: Memory
